collections:
  - name: "news_data"
    label: "News & Updates"
    files:
      - label: "All News Articles"
        name: "articles"
        file: "data/news.json"
        fields:
          - label: "Articles"
            name: "items"
            widget: "list"
            fields:
              - { label: "Headline", name: "title", widget: "string" }
              - {
                  label: "Publish Date",
                  name: "date",
                  widget: "datetime",
                  date_format: "DD MMM YYYY",
                  time_format: false,
                }
              - {
                  label: "Featured Image (Optional)",
                  name: "image",
                  widget: "image",
                  required: false,
                }
              - { label: "Story Content", name: "body", widget: "markdown" }

  - name: "fight_results_data"
    label: "Fight Results"
    files:
      - label: "All Fight Results"
        name: "results"
        file: "data/fight-results.json"
        fields:
          - label: "Fights"
            name: "items"
            widget: "list"
            fields:
              - {
                  label: "Boxer Name / Match Title",
                  name: "title",
                  widget: "string",
                  hint: "e.g., J. Smith vs Opponent (London ABAs)",
                }
              - {
                  label: "Fight Date",
                  name: "date",
                  widget: "datetime",
                  date_format: "DD MMM YYYY",
                  time_format: false,
                }
              - {
                  label: "Result Outcome",
                  name: "outcome",
                  widget: "select",
                  options:
                    [
                      "Win (KO/TKO)",
                      "Win (Points)",
                      "Loss",
                      "Draw",
                      "Exhibition / Skills Bout",
                    ],
                }
              - {
                  label: "Match Summary & Details",
                  name: "body",
                  widget: "markdown",
                  hint: "Describe the round, opponent gym, and performance details.",
                }
