backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "home_data"
    label: "Home"
    files:
      - label: "Homepage Content"
        name: "home"
        file: "data/home.json"
        fields:
          - label: "Affiliation Status Tag"
            name: "affiliation_tag"
            widget: "string"
            hint: "e.g., Awaiting England Boxing Affiliation"
          - label: "Hero Title (Line 1)"
            name: "hero_title_1"
            widget: "string"
            hint: "e.g., Changing Lives"
          - label: "Hero Title (Line 2)"
            name: "hero_title_2"
            widget: "string"
            hint: "e.g., Through Sport"
          - label: "Hero Description"
            name: "hero_desc"
            widget: "text"
            hint: "Main paragraph under the hero title."
          - label: "Mission Section Heading"
            name: "mission_heading"
            widget: "string"
            hint: "e.g., More Than Just a Gym"
          - label: "Mission Section Body"
            name: "mission_body"
            widget: "markdown"
            hint: "Paragraph about the CIC and community impact."
          - label: "Pillar 1 Title"
            name: "p1_title"
            widget: "string"
          - label: "Pillar 1 Description"
            name: "p1_desc"
            widget: "text"
          - label: "Pillar 2 Title"
            name: "p2_title"
            widget: "string"
          - label: "Pillar 2 Description"
            name: "p2_desc"
            widget: "text"
          - label: "Pillar 3 Title"
            name: "p3_title"
            widget: "string"
          - label: "Pillar 3 Description"
            name: "p3_desc"
            widget: "text"

  - name: "news_data"
    label: "News"
    files:
      - label: "News Articles"
        name: "articles"
        file: "data/news.json"
        fields:
          - label: "Articles"
            name: "items"
            widget: "list"
            fields:
              - { label: "Headline", name: "title", widget: "string" }
              - {
                  label: "Publish Date",
                  name: "date",
                  widget: "datetime",
                  date_format: "DD MMM YYYY",
                  time_format: false,
                }
              - {
                  label: "Featured Image (Optional)",
                  name: "image",
                  widget: "image",
                  required: false,
                }
              - { label: "Story Content", name: "body", widget: "markdown" }

  - name: "fight_results_data"
    label: "Fight Results"
    files:
      - label: "Fight Results Ledger"
        name: "results"
        file: "data/fight-results.json"
        fields:
          - label: "Fights"
            name: "items"
            widget: "list"
            fields:
              - {
                  label: "Boxer Name / Match Title",
                  name: "title",
                  widget: "string",
                }
              - {
                  label: "Fight Date",
                  name: "date",
                  widget: "datetime",
                  date_format: "DD MMM YYYY",
                  time_format: false,
                }
              - {
                  label: "Result Outcome",
                  name: "outcome",
                  widget: "select",
                  options:
                    [
                      "Win (KO/TKO)",
                      "Win (Points)",
                      "Loss",
                      "Draw",
                      "Exhibition / Skills Bout",
                    ],
                }
              - {
                  label: "Match Summary & Details",
                  name: "body",
                  widget: "markdown",
                }

  - name: "timetable_data"
    label: "Timetable"
    files:
      - label: "Class Schedule"
        name: "schedule"
        file: "data/timetable.json"
        fields:
          - label: "Classes"
            name: "items"
            widget: "list"
            fields:
              - { label: "Class Name", name: "title", widget: "string" }
              - {
                  label: "Day of the Week",
                  name: "day",
                  widget: "select",
                  options:
                    [
                      "Monday",
                      "Tuesday",
                      "Wednesday",
                      "Thursday",
                      "Friday",
                      "Saturday",
                      "Sunday",
                    ],
                }
              - { label: "Time", name: "time", widget: "string" }
              - {
                  label: "Coach / Instructor",
                  name: "coach",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Description / Details",
                  name: "description",
                  widget: "string",
                  required: false,
                }

  - name: "social_data"
    label: "Socials"
    files:
      - label: "Social Media Hub"
        name: "social"
        file: "data/social.json"
        fields:
          - label: "Page Intro Subtitle"
            name: "intro"
            widget: "string"
            hint: "e.g., Follow our daily grind, fight highlights, and gym culture across all our official channels."
          - label: "Instagram App Widget Class"
            name: "instagram_code"
            widget: "string"
            hint: "e.g., elfsight-app-773fbd50-6aa2-45a3-a590-d144ae87e1a1"
          - label: "TikTok App Widget Class"
            name: "tiktok_code"
            widget: "string"
            required: false
            hint: "e.g., elfsight-app-..."
          - label: "Facebook App Widget Class"
            name: "facebook_code"
            widget: "string"
            required: false
            hint: "e.g., elfsight-app-..."

  - name: "safeguarding_data"
    label: "Safeguarding"
    files:
      - label: "Full Safeguarding Policy"
        name: "safeguarding"
        file: "data/safeguarding.json"
        fields:
          - label: "Welfare Officer Name"
            name: "officer_name"
            widget: "string"
            hint: "e.g., Jane Doe"
          - label: "Welfare Officer Email"
            name: "officer_email"
            widget: "string"
            hint: "e.g., safeguarding@herculesboxing.co.uk"
          - label: "Welfare Officer Phone"
            name: "officer_phone"
            widget: "string"
            hint: "e.g., Available on Request or phone number"
          - label: "1. Core Policy Commitment"
            name: "commitment_body"
            widget: "markdown"
            hint: "Our commitment to child protection, inclusion, and governing body alignment."
          - label: "2. Safe Recruitment & Vetting Standards"
            name: "recruitment_body"
            widget: "markdown"
            hint: "Details on DBS checks, coaching qualifications, and ratios."
          - label: "3. Codes of Conduct"
            name: "codes_body"
            widget: "markdown"
            hint: "Behavioral standards expected within the gym."
          - label: "4. Reporting Concerns & Procedures"
            name: "reporting_body"
            widget: "markdown"
            hint: "Step-by-step instructions on what to do if a disclosure or concern occurs."
          - label: "5. Digital Safety & Photography Policy"
            name: "digital_body"
            widget: "markdown"
            hint: "Rules regarding social media, video recording, and photography on site."

  - name: "contact_data"
    label: "Contact"
    files:
      - label: "Contact Page Details"
        name: "contact"
        file: "data/contact.json"
        fields:
          - label: "Gym Email Address"
            name: "email"
            widget: "string"
            hint: "e.g., info@herculesboxing.co.uk"
          - label: "Gym Phone Number (Display)"
            name: "phone_display"
            widget: "string"
            hint: "e.g., Available on Request"
          - label: "Gym Phone Number (Click-to-Call Link)"
            name: "phone_link"
            widget: "string"
            hint: "e.g., +440000000000"
          - label: "Administration Email"
            name: "admin_email"
            widget: "string"
          - label: "Welfare Email"
            name: "welfare_email"
            widget: "string"
          - label: "Gym Street Address"
            name: "address"
            widget: "string"
            hint: "e.g., 1a Hercules Street"
          - label: "Gym City & Postcode"
            name: "city_postcode"
            widget: "string"
            hint: "e.g., Islington, London, N7 6AT"
          - label: "First Time Visiting Info (Markdown)"
            name: "visiting_info"
            widget: "markdown"
            hint: "Details on what to bring, arrival times, and under-18 rules."

  - name: "about_data"
    label: "About the CIC"
    files:
      - label: "About Page Content"
        name: "about"
        file: "data/about.json"
        fields:
          - label: "Page Subheading / Tagline"
            name: "tagline"
            widget: "string"
            hint: "e.g., Rooted in Islington. Changing lives through discipline..."
          - label: "Who We Are (Section 1)"
            name: "who_we_are"
            widget: "markdown"
            hint: "The main mission and community anchor overview."
          - label: "Expansion & Vision (Section 2)"
            name: "vision"
            widget: "markdown"
            hint: "National expansion and championship ring pathway."
          - label: "Pillar 1 Title"
            name: "pillar_1_title"
            widget: "string"
            hint: "e.g., England Boxing Affiliation"
          - label: "Pillar 1 Content"
            name: "pillar_1_body"
            widget: "markdown"
          - label: "Pillar 2 Title"
            name: "pillar_2_title"
            widget: "string"
            hint: "e.g., Funding & Youth Subsidies"
          - label: "Pillar 2 Content"
            name: "pillar_2_body"
            widget: "markdown"
          - label: "Partnership & Grants Callout (Markdown)"
            name: "partnership_body"
            widget: "markdown"
            hint: "Information for grant bodies and local authorities."
