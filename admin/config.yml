backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "news_data"
    label: "News"
    files:
      - label: "News Articles"
        name: "articles"
        file: "data/news.json"
        fields:
          - label: "Articles"
            name: "items"
            widget: "list"
            fields:
              - { label: "Headline", name: "title", widget: "string" }
              - {
                  label: "Publish Date",
                  name: "date",
                  widget: "datetime",
                  date_format: "DD MMM YYYY",
                  time_format: false,
                }
              - {
                  label: "Featured Image (Optional)",
                  name: "image",
                  widget: "image",
                  required: false,
                }
              - { label: "Story Content", name: "body", widget: "markdown" }

  - name: "fight_results_data"
    label: "Fight Results"
    files:
      - label: "Fight Results Ledger"
        name: "results"
        file: "data/fight-results.json"
        fields:
          - label: "Fights"
            name: "items"
            widget: "list"
            fields:
              - {
                  label: "Boxer Name / Match Title",
                  name: "title",
                  widget: "string",
                }
              - {
                  label: "Fight Date",
                  name: "date",
                  widget: "datetime",
                  date_format: "DD MMM YYYY",
                  time_format: false,
                }
              - {
                  label: "Result Outcome",
                  name: "outcome",
                  widget: "select",
                  options:
                    [
                      "Win (KO/TKO)",
                      "Win (Points)",
                      "Loss",
                      "Draw",
                      "Exhibition / Skills Bout",
                    ],
                }
              - {
                  label: "Match Summary & Details",
                  name: "body",
                  widget: "markdown",
                }

  - name: "timetable_data"
    label: "Timetable"
    files:
      - label: "Class Schedule"
        name: "schedule"
        file: "data/timetable.json"
        fields:
          - label: "Classes"
            name: "items"
            widget: "list"
            fields:
              - { label: "Class Name", name: "title", widget: "string" }
              - {
                  label: "Day of the Week",
                  name: "day",
                  widget: "select",
                  options:
                    [
                      "Monday",
                      "Tuesday",
                      "Wednesday",
                      "Thursday",
                      "Friday",
                      "Saturday",
                      "Sunday",
                    ],
                }
              - { label: "Time", name: "time", widget: "string" }
              - {
                  label: "Coach / Instructor",
                  name: "coach",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Description / Details",
                  name: "description",
                  widget: "string",
                  required: false,
                }
