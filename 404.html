<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Hercules Boxing Club</title>

    <!-- High-Speed DNS Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- Compiled Production Tailwind CSS -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/custom.css" />

    <!-- Optimized Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon & Mobile Theme -->
    <link rel="icon" type="image/webp" href="logo.webp" />
    <meta name="theme-color" content="#000000" />

    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .font-bebas {
        font-family: "Bebas Neue", sans-serif;
      }
    </style>
  </head>

  <body
    class="bg-black text-white flex flex-col min-h-screen items-center justify-center relative overflow-hidden"
  >
    <!-- Darkened Background Image -->
    <div class="fixed inset-0 z-[-1]">
      <img
        src="https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?auto=format&fit=crop&w=1600&q=70"
        alt="Amateur Boxing Gym"
        class="w-full h-full object-cover opacity-30"
      />
    </div>

    <!-- 404 Content -->
    <div class="text-center px-4 relative z-10">
      <h1
        class="text-8xl md:text-9xl font-bebas tracking-widest text-purple-600 mb-2 drop-shadow-lg"
      >
        404
      </h1>
      <h2
        class="text-3xl md:text-4xl font-extrabold uppercase tracking-tight mb-6"
      >
        You're On The Ropes!
      </h2>
      <p class="text-lg text-gray-300 font-medium max-w-md mx-auto mb-10">
        It looks like you've taken a wrong step. The page you are looking for
        has been moved or doesn't exist.
      </p>

      <a
        href="index.html"
        class="inline-block bg-purple-700 text-white px-8 py-4 font-bold uppercase hover:bg-purple-600 transition rounded shadow-lg"
      >
        Back to the Center Ring
      </a>
    </div>
  </body>
</html>
